openapi: 3.1.0
info:
  title: TechXayan Creative Video Editor API
  version: 1.0.0
  description: |
    Production-grade enterprise backend API for TechXayan Creative / my_editor (Windows + Android).
    Provides authentication, project sync with optimistic concurrency control, media asset ingestion
    and intelligence (vector/semantic search), provider-agnostic AI gateway, asynchronous BullMQ job processing,
    speech-to-text with word-level timing, natural-language editor command orchestration,
    realtime collaboration & review timecode commenting, WebSocket/SSE domain event streaming,
    HMAC-verified webhook ingestion with dead-letter queue, and Prometheus observability metrics.
servers:
  - url: http://localhost:4000
    description: Local Development / Test Server
  - url: https://api.editor.techxayan.com
    description: Production Cluster
paths:
  /health:
    get:
      summary: Liveness health check
      operationId: checkHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
                  timestamp: { type: string, format: date-time }
                  uptimeSeconds: { type: number }

  /ready:
    get:
      summary: Readiness probe
      operationId: checkReadiness
      responses:
        '200':
          description: Service and downstream dependencies (DB, Redis, S3) are ready
        '503':
          description: One or more critical downstream dependencies are unavailable

  /metrics:
    get:
      summary: Prometheus observability metrics
      operationId: getMetrics
      responses:
        '200':
          description: Prometheus exposition format text
          content:
            text/plain:
              schema: { type: string }

  # ============================================================================
  # AUTHENTICATION
  # ============================================================================
  /v1/auth/register:
    post:
      summary: Register new user account
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
      responses:
        '201':
          description: Registered successfully
        '409':
          description: Email already registered

  /v1/auth/login:
    post:
      summary: Authenticate user credentials
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Logged in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /v1/auth/refresh:
    post:
      summary: Refresh access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Token refreshed successfully

  /v1/auth/me:
    get:
      summary: Get current authenticated user profile
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'

  # ============================================================================
  # PROJECTS & TIMELINE
  # ============================================================================
  /v1/projects:
    get:
      summary: List user projects with pagination and search
      operationId: listProjects
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: q
          in: query
          description: Search term across title, description, and tags
          schema: { type: string }
        - name: search
          in: query
          description: Alias for search term q
          schema: { type: string }
        - name: status
          in: query
          description: Filter by status
          schema: { type: string, enum: [active, archived, deleted] }
        - name: includeArchived
          in: query
          description: Whether to include archived projects in results
          schema: { type: boolean, default: false }
        - name: sortBy
          in: query
          description: Field to sort by
          schema: { type: string, enum: [updatedAt, createdAt, title], default: updatedAt }
        - name: sortOrder
          in: query
          description: Sort direction
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: Paginated projects list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      projects:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProjectResponse'
                      total: { type: integer }
                      page: { type: integer }
                      limit: { type: integer }
                      totalPages: { type: integer }
    post:
      summary: Create new project
      operationId: createProject
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectPayload'
      responses:
        '201':
          description: Project created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'

  /v1/projects/{id}:
    get:
      summary: Get project by ID
      operationId: getProjectById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Full project document with timeline, tracks, clips, canvas, and assets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '403':
          description: Forbidden - caller does not own project or lack collaborator permission
        '404':
          description: Project not found
    patch:
      summary: Update project with optimistic concurrency control
      operationId: patchProject
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: If-Match
          in: header
          description: Optional ETag or version token for concurrency validation
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectPayload'
      responses:
        '200':
          description: Updated project document with incremented version and fresh ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '403':
          description: Insufficient permissions (viewer cannot edit timeline)
        '409':
          description: Concurrency conflict detected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConcurrencyConflictError'
    put:
      summary: Replace project document with optimistic concurrency control
      operationId: updateProject
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectPayload'
      responses:
        '200':
          description: Updated project document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '409':
          description: Version conflict detected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConcurrencyConflictError'
    delete:
      summary: Delete project (soft delete default, permanent purge with permanent=true)
      operationId: deleteProject
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: permanent
          in: query
          description: If true, permanently purges project and version records
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Project deleted successfully
        '403':
          description: Forbidden - project:delete permission required

  /v1/projects/{id}/rename:
    patch:
      summary: Rename project title
      operationId: renameProject
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 255 }
      responses:
        '200':
          description: Project renamed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'

  /v1/projects/{id}/duplicate:
    post:
      summary: Duplicate project into a fresh active clone
      operationId: duplicateProject
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, description: "Optional title for clone. Defaults to '<Title> (Copy)'" }
      responses:
        '201':
          description: Duplicated project clone created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'

  /v1/projects/{id}/archive:
    post:
      summary: Archive project (soft retention)
      operationId: archiveProject
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Project archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'

  /v1/projects/{id}/restore:
    post:
      summary: Restore archived project back to active state
      operationId: restoreProject
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Project restored to active status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'

  /v1/projects/{id}/permanent-delete:
    post:
      summary: Permanently purge project and associated versions
      operationId: permanentDeleteProject
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Project permanently removed

  /v1/projects/{id}/snapshots:
    post:
      summary: Create manual named backup snapshot
      operationId: createProjectSnapshot
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                changeSummary: { type: string, example: "Manual pre-render backup" }
      responses:
        '201':
          description: Backup snapshot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBackupSnapshot'
    get:
      summary: List backup snapshots for project
      operationId: listProjectSnapshots
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: List of backup snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectBackupSnapshot'

  /v1/projects/{id}/versions:
    get:
      summary: List project version history records
      operationId: listProjectVersions
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Historical version records with versionNumber and change summaries

  /v1/projects/{id}/versions/{versionNumber}/restore:
    post:
      summary: Non-destructive historical version restoration (creates version N+1)
      operationId: restoreProjectVersion
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: versionNumber
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Version restored into a new current state (version N+1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'

  /v1/projects/{id}/autosave:
    post:
      summary: Non-blocking idempotent background autosave with version checking
      operationId: autosaveProject
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseVersion]
              properties:
                baseVersion: { type: integer, description: "Client's known project version" }
                clientMutationId: { type: string, description: "Unique UUID for retry idempotency" }
                clientTimestamp: { type: string, format: date-time }
                deviceName: { type: string, example: "Android Pixel 8" }
                canvas: { type: object }
                timeline: { type: object }
                changeSummary: { type: string }
      responses:
        '200':
          description: Autosaved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  version: { type: integer }
                  etag: { type: string }
                  autosavedAt: { type: string, format: date-time }
        '409':
          description: Concurrency conflict detected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConcurrencyConflictError'

  /v1/projects/{id}/comments:
    get:
      summary: List review comments
      operationId: listProjectComments
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: List of timecoded comments
    post:
      summary: Add timecoded review comment
      operationId: addProjectComment
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCommentPayload'
      responses:
        '201':
          description: Comment created

  /v1/projects/{id}/comments/{commentId}/resolve:
    patch:
      summary: Resolve review comment
      operationId: resolveComment
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: commentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Comment resolved

  # ============================================================================
  # PRODUCTION MEDIA ASSET LIBRARY & FOLDERS
  # ============================================================================
  /v1/media:
    get:
      summary: List user media assets with multi-criteria filtering
      description: Retrieve cataloged media assets with filtering by folder, category, status, favorite, query, and sorting.
      operationId: listMediaAssets
      security:
        - BearerAuth: []
      parameters:
        - name: folderId
          in: query
          description: Filter by folder ID (or 'root' for unorganized assets)
          schema: { type: string }
        - name: favorite
          in: query
          description: Filter by favorite status
          schema: { type: boolean }
        - name: recent
          in: query
          description: Filter assets uploaded in the last N days (default 7 if true)
          schema: { type: boolean }
        - name: category
          in: query
          description: Media category
          schema: { type: string, enum: [video, audio, image, font, lut, sticker, template] }
        - name: type
          in: query
          description: Alias for category
          schema: { type: string }
        - name: status
          in: query
          description: Asset lifecycle status ('all' returns non-deleted assets)
          schema: { type: string, enum: [UPLOADING, UPLOADED, PROCESSING, READY, FAILED, DELETING, DELETED, ARCHIVED, all], default: READY }
        - name: q
          in: query
          description: Case-insensitive search query on asset name and original filename
          schema: { type: string }
        - name: search
          in: query
          description: Alias for search query q
          schema: { type: string }
        - name: sortBy
          in: query
          description: Attribute to sort assets by
          schema: { type: string, enum: [createdAt, updatedAt, name, sizeBytes, durationSeconds], default: createdAt }
        - name: sortOrder
          in: query
          description: Sort direction
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: limit
          in: query
          description: Maximum number of assets to return
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          description: Pagination offset index
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Paginated media assets list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaAsset'
                  meta:
                    type: object
                    properties:
                      total: { type: integer }
                      limit: { type: integer }
                      offset: { type: integer }
                      page: { type: integer }
                      pages: { type: integer }

    post:
      summary: Direct upload for small media assets (< 10 MB)
      description: Upload raw base64 or binary data directly without presigned URL exchange.
      operationId: directUploadMedia
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, mimeType, fileData]
              properties:
                fileName: { type: string }
                mimeType: { type: string }
                fileData: { type: string, description: "Base64 encoded file payload" }
                folderId: { type: string }
                category: { type: string, enum: [video, audio, image, font, lut, sticker, template] }
      responses:
        '201':
          description: Asset created and stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'

  /v1/media/register:
    post:
      summary: Register pre-existing / local media asset
      description: Register a media asset record with client-provided technical telemetry, skipping remote transcoding if already suitable.
      operationId: registerMedia
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, mimeType, fileSizeBytes]
              properties:
                fileName: { type: string }
                mimeType: { type: string }
                fileSizeBytes: { type: integer }
                category: { type: string, enum: [video, audio, image, font, lut, sticker, template] }
                folderId: { type: string }
                checksumSha256: { type: string, description: "64 hex SHA-256 hash" }
                durationSeconds: { type: number }
                width: { type: integer }
                height: { type: integer }
                framerate: { type: number }
                codec: { type: string }
                bitrateKbps: { type: integer }
                audioChannels: { type: integer }
                audioSampleRate: { type: integer }
                rotation: { type: integer }
      responses:
        '201':
          description: Media asset registered with READY status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'

  /v1/media/presign:
    post:
      summary: Request presigned upload URL (Direct or Multipart)
      description: Initiates upload session with SHA-256 deduplication checking, path traversal validation, and size quotas.
      operationId: presignMediaUpload
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, fileSizeBytes, mimeType]
              properties:
                fileName: { type: string }
                fileSizeBytes: { type: integer }
                mimeType: { type: string }
                category: { type: string, enum: [video, audio, image, font, lut, sticker, template] }
                folderId: { type: string }
                projectId: { type: string }
                checksumSha256: { type: string, description: "64 hex SHA-256 for integrity & deduplication" }
                uploadType: { type: string, enum: [auto, direct, multipart], default: auto }
                partCount: { type: integer, description: "Required for multipart uploads" }
      responses:
        '200':
          description: Presigned upload URL or deduplication reference
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      mediaId: { type: string }
                      fileKey: { type: string }
                      uploadType: { type: string, enum: [direct, multipart] }
                      url: { type: string, description: "Presigned URL for direct upload" }
                      uploadId: { type: string, description: "Multipart upload ID" }
                      parts:
                        type: array
                        items:
                          type: object
                          properties:
                            partNumber: { type: integer }
                            url: { type: string }
                      expiresInSeconds: { type: integer }
                      isDuplicate: { type: boolean, description: "True if SHA-256 match avoided duplicate upload" }

  /v1/media/complete:
    post:
      summary: Finalize upload, verify magic bytes, and dispatch processing job
      description: Validates binary container magic bytes, verifies SHA-256 integrity, transitions status to PROCESSING, and dispatches FFprobe/thumbnail/waveform/proxy pipeline.
      operationId: completeMediaUpload
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mediaId]
              properties:
                mediaId: { type: string }
                uploadId: { type: string }
                parts:
                  type: array
                  items:
                    type: object
                    required: [partNumber, eTag]
                    properties:
                      partNumber: { type: integer }
                      eTag: { type: string }
                checksumSha256: { type: string }
                durationSeconds: { type: number }
                width: { type: integer }
                height: { type: integer }
      responses:
        '200':
          description: Upload confirmed; processing dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'

  /v1/media/{id}:
    get:
      summary: Retrieve media asset by ID
      description: Returns full asset entity including variants (original, thumbnail, waveform, proxy), technical telemetry, and active presigned download URL.
      operationId: getMediaById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Media asset details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '404':
          description: Asset not found or deleted

    delete:
      summary: Delete media asset (Soft or Permanent)
      description: By default soft-deletes asset (marking status DELETED). Pass permanent=true to purge physical files from S3/MinIO.
      operationId: deleteMedia
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: permanent
          in: query
          description: Purge physical storage binaries immediately
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Media asset deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      status: { type: string, enum: [DELETED] }
                      permanent: { type: boolean }

  /v1/media/{id}/rename:
    patch:
      summary: Rename media asset
      operationId: renameMedia
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '200':
          description: Media asset renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'

  /v1/media/{id}/move:
    patch:
      summary: Move media asset to folder or root
      operationId: moveMedia
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                folderId: { type: string, nullable: true, description: "Target folder ID, or null for root" }
      responses:
        '200':
          description: Media asset moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'

  /v1/media/{id}/favorite:
    post:
      summary: Set media asset favorite status
      operationId: setMediaFavorite
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                isFavorite: { type: boolean, default: true }
      responses:
        '200':
          description: Favorite status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
    patch:
      summary: Update media asset favorite status (alias)
      operationId: patchMediaFavorite
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                isFavorite: { type: boolean, default: true }
      responses:
        '200':
          description: Favorite status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'

  /v1/media/{id}/archive:
    post:
      summary: Archive media asset
      description: Sets media asset status to ARCHIVED, hiding it from default active bin views while preserving storage.
      operationId: archiveMedia
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Media asset archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'

  /v1/media/{id}/restore:
    post:
      summary: Restore archived media asset
      description: Transitions ARCHIVED media asset back to READY status.
      operationId: restoreMedia
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Media asset restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'

  # ============================================================================
  # MEDIA FOLDERS HIERARCHY
  # ============================================================================
  /v1/media/folders:
    get:
      summary: List media folders
      description: Returns organized folders for the authenticated user, optionally scoped by parentId.
      operationId: listMediaFolders
      security:
        - BearerAuth: []
      parameters:
        - name: parentId
          in: query
          description: Filter folders by parent folder ID (or 'root' for top-level folders)
          schema: { type: string }
      responses:
        '200':
          description: Folders list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaFolder'

    post:
      summary: Create media folder
      operationId: createMediaFolder
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                parentId: { type: string, nullable: true }
                color: { type: string, example: "#10B981" }
      responses:
        '201':
          description: Media folder created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaFolder'

  /v1/media/folders/{id}:
    get:
      summary: Get media folder by ID
      operationId: getMediaFolderById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Media folder details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaFolder'

    patch:
      summary: Rename media folder or update color
      operationId: renameMediaFolder
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                color: { type: string }
      responses:
        '200':
          description: Media folder updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaFolder'

    delete:
      summary: Delete media folder
      description: Deletes the folder and safely unlinks contained media assets and child folders back to root.
      operationId: deleteMediaFolder
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Folder deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      deleted: { type: boolean }

  /v1/media/folders/{id}/move:
    patch:
      summary: Move media folder to new parent or root
      operationId: moveMediaFolder
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parentId: { type: string, nullable: true, description: "New parent folder ID, or null for root" }
      responses:
        '200':
          description: Media folder moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaFolder'

  /v1/media/search:
    post:
      summary: Semantic, object, speech, and scene search across media assets
      operationId: searchMedia
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaSearchQuery'
      responses:
        '200':
          description: Ranked search results with matched timeline ranges

  # ============================================================================
  # AI GATEWAY & COMMANDS
  # ============================================================================
  /v1/ai/transcribe:
    post:
      summary: Speech-to-text transcription with word-level timing
      operationId: transcribeMedia
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mediaUrl]
              properties:
                mediaUrl: { type: string, format: uri }
                language: { type: string, default: "en" }
                enableSpeakerDiarization: { type: boolean, default: true }
      responses:
        '200':
          description: Word-level transcript with timestamps and speakers

  /v1/ai/captions:
    post:
      summary: Generate timeline Caption objects
      operationId: generateCaptions
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mediaUrl]
              properties:
                mediaUrl: { type: string, format: uri }
                style: { type: string, default: "dynamic" }
      responses:
        '200':
          description: Segmented timeline caption objects

  /v1/ai/editing-analysis:
    post:
      summary: Analyze audio & video for silences, fillers, and highlights
      operationId: analyzeEditingFeatures
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId]
              properties:
                projectId: { type: string, format: uuid }
                options:
                  type: object
                  properties:
                    detectSilences: { type: boolean, default: true }
                    minSilenceDuration: { type: number, default: 0.5 }
      responses:
        '200':
          description: Structured editing features

  /v1/ai/commands/interpret:
    post:
      summary: Natural-language editor command interpretation
      operationId: interpretNaturalCommand
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: { type: string, maxLength: 10000 }
                context: { type: object }
      responses:
        '200':
          description: Generated EditorCommandPlan for Flutter ProjectBloc

  /v1/ai/commands/validate:
    post:
      summary: Dry-run validate editor commands and generate preview diff
      operationId: validateCommands
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commands]
              properties:
                commands:
                  type: array
                  items:
                    $ref: '#/components/schemas/EditorCommand'
                timelineDuration: { type: number }
      responses:
        '200':
          description: Validation outcome and execution preview diff

  /v1/ai/short-orchestration:
    post:
      summary: Orchestrate long-form video into social short (9:16, 1:1, 4:5)
      operationId: orchestrateShortVideo
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId]
              properties:
                projectId: { type: string, format: uuid }
                targetDuration: { type: integer, enum: [30, 45, 60], default: 45 }
                aspectRatio: { type: string, enum: ['9:16', '1:1', '4:5'], default: '9:16' }
                captionPreset: { type: string, default: 'bold_yellow' }
                musicPreset: { type: string, default: 'upbeat_ambient' }
      responses:
        '200':
          description: Short orchestration command plan

  /v1/ai/generate/{type}:
    post:
      summary: Asynchronous AI asset generation (image, video, music, sfx, voice, script)
      operationId: generateAsset
      security:
        - BearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [image, video, music, sfx, voice, script]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: { type: string, maxLength: 10000 }
                projectId: { type: string, format: uuid }
                parameters: { type: object }
      responses:
        '202':
          description: Generation job queued

  /v1/ai/jobs:
    post:
      summary: Submit asynchronous AI job (compatible with Flutter BackendAIProvider and web)
      operationId: createAiJob
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, example: "auto_caption" }
                projectId: { type: string }
                parameters: { type: object }
                input: { type: object }
      responses:
        '201':
          description: AI job enqueued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiJobResponse'

  /ai/jobs:
    post:
      summary: Root alias for submitting AI jobs (unauthenticated local client fallback)
      operationId: createAiJobRoot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, example: "auto_caption" }
                projectId: { type: string }
                parameters: { type: object }
                input: { type: object }
      responses:
        '201':
          description: AI job enqueued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiJobResponse'

  /ai/uploads:
    post:
      summary: AI asset media upload ticket endpoint for Flutter clients
      operationId: uploadAiMediaRoot
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
          application/json:
            schema:
              type: object
              properties:
                fileName: { type: string }
                fileSizeBytes: { type: integer }
                mimeType: { type: string }
      responses:
        '200':
          description: Upload confirmed with ticket and remote URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadId: { type: string }
                  uploaded: { type: boolean, example: true }
                  remoteUrl: { type: string, format: uri }

  /v1/ai/jobs/{id}:
    get:
      summary: Query asynchronous AI job status and progress
      operationId: getAiJob
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Job status, progress, input, and output
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiJobResponse'

  /ai/jobs/{id}:
    get:
      summary: Root alias to query asynchronous AI job status (Flutter BackendAIProvider)
      operationId: getAiJobRoot
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Job status, progress, input, and output
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiJobResponse'

  /v1/ai/jobs/{id}/cancel:
    post:
      summary: Cancel running or queued AI job
      operationId: cancelAiJob
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Job cancelled

  # ============================================================================
  # VIDEO RENDER & EXPORT JOBS
  # ============================================================================
  /v1/jobs/render:
    post:
      summary: Submit asynchronous video timeline rendering export job
      operationId: createRenderJob
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId]
              properties:
                projectId: { type: string, format: uuid }
                format: { type: string, enum: [mp4, mov, webm], default: mp4 }
                resolutionWidth: { type: integer, default: 1920 }
                resolutionHeight: { type: integer, default: 1080 }
                framerate: { type: number, default: 30.0 }
                bitrateKbps: { type: integer }
      responses:
        '202':
          description: Render export job submitted

  # ============================================================================
  # BILLING & SUBSCRIPTIONS
  # ============================================================================
  /v1/billing/plans:
    get:
      summary: List available subscription plans
      operationId: listBillingPlans
      responses:
        '200':
          description: Subscription plans and credit allowances

  /v1/billing/checkout:
    post:
      summary: Create Stripe checkout session
      operationId: createCheckoutSession
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId: { type: string }
                successUrl: { type: string }
                cancelUrl: { type: string }
      responses:
        '200':
          description: Checkout session URL

  /v1/billing/credits:
    get:
      summary: Get user current credit balance
      operationId: getCreditBalance
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current balance, tier, and monthly allowance

  # ============================================================================
  # REALTIME & WEBHOOKS
  # ============================================================================
  /v1/events/stream:
    get:
      summary: Server-Sent Events (SSE) stream for project, job, and user events
      operationId: streamRealtimeEvents
      security:
        - BearerAuth: []
      parameters:
        - name: channels
          in: query
          schema: { type: string, example: "project:123,job:456" }
      responses:
        '200':
          description: Event stream (text/event-stream)

  /v1/webhooks/stripe:
    post:
      summary: Stripe webhook ingestion with HMAC-SHA256 signature verification
      operationId: ingestStripeWebhook
      parameters:
        - name: stripe-signature
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Webhook received and processed
        '400':
          description: Invalid or missing signature

  /v1/webhooks/dead-letter:
    get:
      summary: List dead-lettered webhook events
      operationId: listDeadLetterWebhooks
      security:
        - AdminAuth: []
      responses:
        '200':
          description: Failed webhook items for dead-letter analysis

  /v1/webhooks/dead-letter/{id}/retry:
    post:
      summary: Manually retry dead-lettered webhook
      operationId: retryDeadLetterWebhook
      security:
        - AdminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Webhook re-queued

  # ============================================================================
  # ADMIN & OBSERVABILITY
  # ============================================================================
  /v1/admin/users:
    get:
      summary: List platform users
      operationId: adminListUsers
      security:
        - AdminAuth: []
      responses:
        '200':
          description: User accounts list
  /v1/admin/audit-logs:
    get:
      summary: View administrative audit trails
      operationId: adminGetAuditLogs
      security:
        - AdminAuth: []
      responses:
        '200':
          description: Immutable security and audit events

  /v1/admin/media/summary:
    get:
      summary: Media storage and processing operational summary
      description: Returns media assets counts, storage usage in bytes, processing failure metrics, top largest assets, and recent uploads.
      operationId: adminGetMediaSummary
      security:
        - AdminAuth: []
      responses:
        '200':
          description: Media library operational telemetry summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/AdminMediaSummary'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AdminAuth:
      type: apiKey
      in: header
      name: x-admin-key

  schemas:
    MediaAsset:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        projectId: { type: string, nullable: true }
        folderId: { type: string, nullable: true }
        name: { type: string }
        originalFilename: { type: string }
        category: { type: string, enum: [video, audio, image, font, lut, sticker, template] }
        fileKey: { type: string }
        mimeType: { type: string }
        fileSizeBytes: { type: integer }
        checksumSha256: { type: string }
        durationSeconds: { type: number }
        width: { type: integer }
        height: { type: integer }
        framerate: { type: number }
        codec: { type: string }
        bitrateKbps: { type: integer }
        audioChannels: { type: integer }
        audioSampleRate: { type: integer }
        rotation: { type: integer }
        orientation: { type: string, enum: [landscape, portrait, square] }
        status: { type: string, enum: [UPLOADING, UPLOADED, PROCESSING, READY, FAILED, DELETING, DELETED, ARCHIVED] }
        isFavorite: { type: boolean }
        downloadUrl: { type: string, format: uri }
        thumbnailUrl: { type: string, format: uri }
        variants:
          $ref: '#/components/schemas/MediaVariants'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    MediaVariants:
      type: object
      properties:
        original:
          type: object
          properties:
            fileKey: { type: string }
            url: { type: string }
            sizeBytes: { type: integer }
            mimeType: { type: string }
        thumbnail:
          type: object
          properties:
            fileKey: { type: string }
            url: { type: string }
            width: { type: integer }
            height: { type: integer }
        waveform:
          type: object
          properties:
            fileKey: { type: string }
            url: { type: string }
            peaks:
              type: array
              items: { type: number }
            channels: { type: integer }
            samplesPerPixel: { type: integer }
        proxy:
          type: object
          properties:
            fileKey: { type: string }
            url: { type: string }
            resolution: { type: string }
            codec: { type: string }
            sizeBytes: { type: integer }
        previewDerivative:
          type: object
          properties:
            fileKey: { type: string }
            url: { type: string }
            resolution: { type: string }
            durationSeconds: { type: number }

    MediaFolder:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        name: { type: string }
        parentId: { type: string, nullable: true }
        color: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AdminMediaSummary:
      type: object
      properties:
        mediaCount: { type: integer }
        storageUsageBytes: { type: integer }
        processingFailures:
          type: object
          properties:
            count: { type: integer }
            recentErrors:
              type: array
              items:
                type: object
                properties:
                  mediaId: { type: string }
                  name: { type: string }
                  reason: { type: string }
                  updatedAt: { type: string }
        largestAssets:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              category: { type: string }
              sizeBytes: { type: integer }
              createdAt: { type: string }
        recentUploads:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              category: { type: string }
              status: { type: string }
              sizeBytes: { type: integer }
              createdAt: { type: string }

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
        tokens:
          type: object
          properties:
            accessToken: { type: string }
            refreshToken: { type: string }
            expiresInSeconds: { type: integer }

    UserProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [USER, ADMIN, SUPERADMIN] }
        plan: { type: string }
        creditsBalance: { type: integer }

    CreateProjectPayload:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        canvas:
          $ref: '#/components/schemas/Canvas'
        resolution:
          type: object
          description: "Flutter ProjectModel compatible resolution"
          properties:
            width: { type: integer, example: 1920 }
            height: { type: integer, example: 1080 }
        frameRate: { type: number, example: 30.0 }
        durationMs: { type: integer, example: 60000 }
        tracks:
          type: array
          description: "Flutter ProjectModel compatible top-level track list"
          items:
            $ref: '#/components/schemas/TimelineTrack'

    UpdateProjectPayload:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        expectedVersion: { type: integer }
        canvas:
          $ref: '#/components/schemas/Canvas'
        timeline: { type: object }
        resolution:
          type: object
          properties:
            width: { type: integer }
            height: { type: integer }
        frameRate: { type: number }
        durationMs: { type: integer }
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/TimelineTrack'

    ProjectResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        version: { type: integer }
        schemaVersion: { type: integer, example: 1 }
        resolution:
          type: object
          description: "Flutter ProjectModel compatible resolution"
          properties:
            width: { type: integer }
            height: { type: integer }
        frameRate: { type: number, example: 30.0 }
        durationMs: { type: integer, example: 60000 }
        canvas:
          $ref: '#/components/schemas/Canvas'
        timeline: { type: object }
        tracks:
          type: array
          description: "Flutter ProjectModel compatible tracks with millisecond offsets"
          items:
            $ref: '#/components/schemas/TimelineTrack'
        assets:
          type: array
          items:
            $ref: '#/components/schemas/ProjectAsset'
        markers:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              positionMs: { type: integer }
              label: { type: string }
              color: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Canvas:
      type: object
      properties:
        resolutionWidth: { type: integer, default: 1920 }
        resolutionHeight: { type: integer, default: 1080 }
        framerate: { type: number, default: 30.0 }
        aspectRatio: { type: string, default: "16:9" }
        colorSpace: { type: string, default: "rec709" }
        backgroundColor: { type: string, default: "#000000" }

    ProjectAsset:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [video, audio, image, font, lut, other] }
        uri: { type: string }
        duration: { type: number }
        thumbnailUrl: { type: string }

    AddCommentPayload:
      type: object
      required: [content, timecode]
      properties:
        content: { type: string }
        timecode: { type: number }

    MediaSearchQuery:
      type: object
      properties:
        query: { type: string }
        types:
          type: array
          items: { type: string }
        durationMin: { type: number }
        durationMax: { type: number }
        limit: { type: integer, default: 20 }

    EditorCommand:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum:
            - DELETE_RANGE
            - SPLIT_CLIP
            - TRIM_CLIP
            - SET_SPEED
            - ADD_COLOR_PRESET
            - ADD_CAPTIONS
            - SET_CANVAS
            - AUTO_REFRAME
            - ADD_AUDIO
            - DUCK_AUDIO
        trackId: { type: string }
        clipId: { type: string }
        timeRange:
          type: object
          properties:
            start: { type: number }
            end: { type: number }
        parameters: { type: object }

    AiJob:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        status: { type: string, enum: [QUEUED, RUNNING, COMPLETED, FAILED, CANCELLED] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        input: { type: object }
        output: { type: object }
        error: { type: string }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }

    AiJobResponse:
      type: object
      description: "Dual format response satisfying Flutter BackendAIProvider._parseJob and Web clients"
      properties:
        id: { type: string }
        jobId: { type: string }
        type: { type: string }
        status: { type: string, enum: [queued, processing, completed, failed, cancelled] }
        progress: { type: number, minimum: 0.0, maximum: 1.0 }
        result: { type: object }
        error: { type: string }
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            job:
              $ref: '#/components/schemas/AiJob'

    TimelineTrack:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [video, audio, text, effect, image, overlay] }
        name: { type: string }
        isLocked: { type: boolean, default: false }
        isMuted: { type: boolean, default: false }
        clips:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              assetId: { type: string }
              timelineStartMs: { type: integer }
              durationMs: { type: integer }
              sourceInPointMs: { type: integer }
              sourceOutPointMs: { type: integer }
              speed: { type: number, default: 1.0 }
              volume: { type: number, default: 1.0 }
              isLocked: { type: boolean, default: false }
              isMuted: { type: boolean, default: false }
              text:
                type: object
                properties:
                  content: { type: string }
                  fontFamily: { type: string }
                  fontSize: { type: number }
                  color: { type: string }
                  bold: { type: boolean }
                  italic: { type: boolean }
                  alignment: { type: string, enum: [left, center, right] }
                  positionX: { type: number }
                  positionY: { type: number }
              effects:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    type: { type: string }
                    name: { type: string }
                    isEnabled: { type: boolean }
                    parameters: { type: object }
              keyframes:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    property: { type: string }
                    timeMs: { type: integer }
                    value: { type: number }
                    easing: { type: string }
              audio:
                type: object
                properties:
                  volume: { type: number }
                  pan: { type: number }
                  fadeInMs: { type: integer }
                  fadeOutMs: { type: integer }
                  isMuted: { type: boolean }
                  pitch: { type: number }
                  eq: { type: object }
              captions:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    startMs: { type: integer }
                    endMs: { type: integer }
                    text: { type: string }
                    speaker: { type: string }

    ConcurrencyConflictError:
      type: object
      description: "Structured conflict payload returned when client version/ETag is stale"
      required: [code, message, details]
      properties:
        code:
          type: string
          example: "CONCURRENCY_CONFLICT"
        message:
          type: string
          example: "Conflict: Project was modified by another session or device"
        details:
          type: object
          required: [currentVersion, expectedVersion, serverUpdatedAt, serverETag]
          properties:
            currentVersion:
              type: integer
              description: "Latest version number on the server"
              example: 3
            expectedVersion:
              type: integer
              description: "Version the client attempted to update from"
              example: 1
            serverUpdatedAt:
              type: string
              format: date-time
              description: "Timestamp of current server revision"
            serverETag:
              type: string
              description: "Current server ETag token"
              example: "\"v3-90d40523\""
            conflictingDevice:
              type: string
              description: "Device name that saved the conflicting version, if known"
              example: "Web Editor"

    ProjectBackupSnapshot:
      type: object
      description: "Point-in-time snapshot of complete project state"
      properties:
        id: { type: string }
        projectId: { type: string, format: uuid }
        versionNumber: { type: integer }
        changeSummary: { type: string }
        isAutoSave: { type: boolean }
        deviceName: { type: string }
        createdAt: { type: string, format: date-time }
